<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel='stylesheet' href='bower_components/bootstrap/dist/css/bootstrap.css'>
    <script type='text/javascript' src="bower_components/jquery/dist/jquery.js"></script>
    <script type='text/javascript' src="clientes.js"></script>
    <script type='text/javascript'>
        var ciclo = 0;
        $(document).ready(function () {
            $('#boton').click(function() {
                for(i=ciclo*10;i<ciclo*10+10;i++)
                {
                    var calculo = clientes[i].activo - clientes[i].pasivo;
                    var calculo_string;
                    if(calculo < 0)
                    {
                        calculo_string = '<td class="alert-danger">$ ' + calculo.toFixed(2) + '</td>';
                    }
                    else
                    {
                        calculo_string = '<td class="alert-success">$ ' + calculo.toFixed(2) + '</td>';
                    }
                    if(clientes[i].ID != "")
                    {
                        $('#tabla-clientes tbody').append(
                                $('<tr>').append(
                                        $('<td>').innerHTML = '<img src="'+clientes[i].logo+'">',
                                        $('<td>').text(clientes[i].id),
                                        $('<td>').text(clientes[i].razonSocial),
                                        $('<td>').text(clientes[i].direccion.calle + ' ' + clientes[i].direccion.altura + ', ' + clientes[i].direccion.ciudad),
                                        $('<td>').text(clientes[i].presidente.nombre + ' ' + clientes[i].presidente.apellido),
                                        calculo_string,
                                        $('<td>').text(clientes[i].fechaCreacion)
                                )
                        );
                    }
                }
                ciclo++;
            });
        });
    </script>
    <title>TP 1</title>
</head>
<body>
<div class="container text-center">
    <h1>Curso Web</h1>
</div>
<div class="container">
    <div class="row">

        <div class="row">
            <div class="col-lg-2">
                <input type="button" value="Buscar" id="boton">
            </div>
        </div>
        <table class="table table-bordered table-striped" id="tabla-clientes">
            <thead>
                <tr>
                    <th></th>
                    <th>ID</th>
                    <th>Razón Social</th>
                    <th>Dirección</th>
                    <th>Presidente</th>
                    <th>Patrimonio neto</th>
                    <th>Inicio de act.</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
